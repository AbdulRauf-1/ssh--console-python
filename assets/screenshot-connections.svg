<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="logo2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FC894"/><stop offset="1" stop-color="#0C8F68"/>
    </linearGradient>
    <clipPath id="round2"><rect width="1000" height="600" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#round2)">
    <rect width="1000" height="600" fill="#F6F8F7"/>

    <!-- browser chrome -->
    <rect width="1000" height="38" fill="#E8ECEA"/>
    <circle cx="20" cy="19" r="5" fill="#F6685E"/><circle cx="38" cy="19" r="5" fill="#F7BD46"/><circle cx="56" cy="19" r="5" fill="#5FCB6E"/>
    <rect x="80" y="9" width="360" height="20" rx="10" fill="#FFFFFF"/>
    <text x="94" y="23" font-size="11" fill="#5C6B64" font-family="Consolas, monospace">🔒 127.0.0.1:8022</text>

    <!-- sidebar -->
    <rect x="0" y="38" width="230" height="562" fill="#FFFFFF"/>
    <line x1="230" y1="38" x2="230" y2="600" stroke="#E1E7E4"/>
    <rect x="16" y="54" width="26" height="26" rx="7" fill="url(#logo2)"/>
    <g stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".95"><line x1="29" y1="67" x2="29" y2="61"/><line x1="29" y1="67" x2="23.5" y2="73"/><line x1="29" y1="67" x2="34.5" y2="73"/></g>
    <text x="52" y="72" font-size="15" font-weight="700" fill="#16211C">SSH Console</text>

    <rect x="12" y="94" width="206" height="34" rx="9" fill="#DDF1E8"/>
    <text x="26" y="116" font-size="13" font-weight="600" fill="#0A7355">＋  Add connection</text>

    <text x="14" y="150" font-size="10" font-weight="700" letter-spacing="1" fill="#5C6B64">SSH CONNECTIONS</text>
    <circle cx="28" cy="177" r="4" fill="#0F8A5F"/><text x="42" y="181" font-size="13" fill="#16211C">prod-web</text>
    <circle cx="28" cy="205" r="4" fill="#0F8A5F"/><text x="42" y="209" font-size="13" fill="#16211C">db-primary</text>
    <circle cx="28" cy="233" r="4" fill="#5C6B64"/><text x="42" y="237" font-size="13" fill="#16211C">staging-01</text>

    <line x1="12" y1="556" x2="218" y2="556" stroke="#E1E7E4"/>
    <text x="30" y="580" font-size="13" fill="#5C6B64">◉  Recordings</text>

    <!-- content -->
    <text x="258" y="80" font-size="22" font-weight="700" fill="#16211C">Add a connection</text>
    <text x="258" y="104" font-size="12.5" fill="#5C6B64">Add an SSH server, then open its terminal, files and recordings from the left.</text>

    <!-- form card -->
    <rect x="258" y="120" width="716" height="196" rx="12" fill="#FFFFFF" stroke="#E1E7E4"/>
    <g font-size="11" fill="#5C6B64">
      <text x="276" y="150">Name</text><text x="470" y="150">Host</text><text x="820" y="150">Port</text>
    </g>
    <rect x="276" y="156" width="176" height="30" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="288" y="176" font-size="12" fill="#16211C">prod-web</text>
    <rect x="470" y="156" width="330" height="30" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="482" y="176" font-size="12" fill="#16211C">203.0.113.10</text>
    <rect x="820" y="156" width="134" height="30" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="832" y="176" font-size="12" fill="#16211C">22</text>

    <g font-size="11" fill="#5C6B64"><text x="276" y="208">Login user</text><text x="620" y="208">Authentication</text></g>
    <rect x="276" y="214" width="330" height="30" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="288" y="234" font-size="12" fill="#16211C">ubuntu</text>
    <rect x="620" y="214" width="334" height="30" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="632" y="234" font-size="12" fill="#16211C">Private key</text><text x="944" y="234" font-size="12" fill="#5C6B64" text-anchor="end">▾</text>

    <rect x="276" y="258" width="150" height="34" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="298" y="280" font-size="12" font-weight="600" fill="#16211C">⭱ Upload key file</text>
    <text x="440" y="280" font-size="11.5" fill="#5C6B64">No file chosen — e.g. id_ed25519</text>

    <rect x="820" y="330" width="134" height="34" rx="8" fill="#0A7355"/><text x="887" y="352" font-size="12.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Add connection</text>

    <!-- connections table -->
    <text x="258" y="404" font-size="14" font-weight="600" fill="#16211C">Your connections</text>
    <rect x="258" y="416" width="716" height="150" rx="12" fill="#FFFFFF" stroke="#E1E7E4"/>
    <g font-size="11" font-weight="600" fill="#5C6B64">
      <text x="278" y="444">Name</text><text x="470" y="444">Address</text><text x="680" y="444">User</text><text x="810" y="444">Status</text></g>
    <line x1="258" y1="454" x2="974" y2="454" stroke="#E1E7E4"/>
    <g font-size="12.5">
      <text x="278" y="482" fill="#0A7355">prod-web</text><text x="470" y="482" fill="#5C6B64" font-family="Consolas, monospace">203.0.113.10:22</text><text x="680" y="482" fill="#5C6B64" font-family="Consolas, monospace">ubuntu</text>
      <rect x="810" y="470" width="52" height="18" rx="9" fill="#D4EFE2"/><text x="820" y="483" font-size="10.5" font-weight="600" fill="#0A6B44">online</text>
      <line x1="258" y1="500" x2="974" y2="500" stroke="#E1E7E4"/>
      <text x="278" y="524" fill="#0A7355">db-primary</text><text x="470" y="524" fill="#5C6B64" font-family="Consolas, monospace">10.0.4.20:22</text><text x="680" y="524" fill="#5C6B64" font-family="Consolas, monospace">root</text>
      <rect x="810" y="512" width="52" height="18" rx="9" fill="#D4EFE2"/><text x="820" y="525" font-size="10.5" font-weight="600" fill="#0A6B44">online</text>
      <line x1="258" y1="542" x2="974" y2="542" stroke="#E1E7E4"/>
      <text x="278" y="562" fill="#0A7355">staging-01</text><text x="470" y="562" fill="#5C6B64" font-family="Consolas, monospace">192.168.1.50:22</text><text x="680" y="562" fill="#5C6B64" font-family="Consolas, monospace">deploy</text>
      <rect x="810" y="550" width="66" height="18" rx="9" fill="#EEF2F0"/><text x="820" y="563" font-size="10.5" font-weight="600" fill="#5C6B64">unknown</text>
    </g>
  </g>
</svg>
