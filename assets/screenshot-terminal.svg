<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="logo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FC894"/><stop offset="1" stop-color="#0C8F68"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="600" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1000" height="600" fill="#F6F8F7"/>

    <!-- browser chrome -->
    <rect width="1000" height="38" fill="#E8ECEA"/>
    <circle cx="20" cy="19" r="5" fill="#F6685E"/><circle cx="38" cy="19" r="5" fill="#F7BD46"/><circle cx="56" cy="19" r="5" fill="#5FCB6E"/>
    <rect x="80" y="9" width="400" height="20" rx="10" fill="#FFFFFF"/>
    <text x="94" y="23" font-size="11" fill="#5C6B64" font-family="Consolas, monospace">🔒 127.0.0.1:8022/servers/prod-web</text>

    <!-- sidebar -->
    <rect x="0" y="38" width="230" height="562" fill="#FFFFFF"/>
    <line x1="230" y1="38" x2="230" y2="600" stroke="#E1E7E4"/>
    <rect x="16" y="54" width="26" height="26" rx="7" fill="url(#logo)"/>
    <g stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".95"><line x1="29" y1="67" x2="29" y2="61"/><line x1="29" y1="67" x2="23.5" y2="73"/><line x1="29" y1="67" x2="34.5" y2="73"/></g>
    <text x="52" y="72" font-size="15" font-weight="700" fill="#16211C">SSH Console</text>

    <rect x="12" y="94" width="206" height="34" rx="9" fill="#DDF1E8"/>
    <text x="26" y="116" font-size="13" font-weight="600" fill="#0A7355">＋  Add connection</text>

    <text x="14" y="150" font-size="10" font-weight="700" letter-spacing="1" fill="#5C6B64">SSH CONNECTIONS</text>
    <rect x="12" y="160" width="206" height="34" rx="9" fill="#DDF1E8"/>
    <circle cx="28" cy="177" r="4" fill="#0F8A5F"/><text x="42" y="181" font-size="13" font-weight="600" fill="#0A7355">prod-web</text>
    <circle cx="28" cy="211" r="4" fill="#0F8A5F"/><text x="42" y="215" font-size="13" fill="#16211C">db-primary</text>
    <circle cx="28" cy="245" r="4" fill="#5C6B64"/><text x="42" y="249" font-size="13" fill="#16211C">staging-01</text>

    <line x1="12" y1="556" x2="218" y2="556" stroke="#E1E7E4"/>
    <text x="30" y="580" font-size="13" fill="#5C6B64">◉  Recordings</text>

    <!-- content -->
    <text x="258" y="70" font-size="12" fill="#0A7355">← Connections</text>
    <text x="258" y="98" font-size="22" font-weight="700" fill="#16211C">prod-web</text>
    <rect x="368" y="82" width="58" height="20" rx="10" fill="#D4EFE2"/>
    <text x="378" y="96" font-size="11" font-weight="600" fill="#0A6B44">online</text>

    <g font-family="Consolas, monospace" font-size="11" fill="#5C6B64">
      <rect x="258" y="114" width="196" height="20" rx="10" fill="#EEF2F0"/><text x="268" y="128">ubuntu@203.0.113.10:22</text>
      <rect x="462" y="114" width="66" height="20" rx="10" fill="#EEF2F0"/><text x="472" y="128">auth: key</text>
      <rect x="536" y="114" width="112" height="20" rx="10" fill="#EEF2F0"/><text x="546" y="128">checked just now</text>
      <rect x="656" y="114" width="118" height="20" rx="10" fill="#EEF2F0"/><text x="666" y="128">host key pinned</text>
    </g>

    <!-- action buttons -->
    <g font-size="12" font-weight="600">
      <rect x="258" y="148" width="118" height="28" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="278" y="166" fill="#16211C">Test connection</text>
      <rect x="384" y="148" width="96" height="28" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="400" y="166" fill="#16211C">Browse files</text>
      <rect x="488" y="148" width="52" height="28" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="504" y="166" fill="#16211C">Edit</text>
      <rect x="548" y="148" width="150" height="28" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="566" y="166" fill="#16211C">Reconnect terminal</text>
    </g>

    <text x="258" y="205" font-size="14" font-weight="600" fill="#16211C">Terminal</text>

    <!-- terminal window -->
    <rect x="258" y="216" width="716" height="330" rx="10" fill="#000000" stroke="#E1E7E4"/>
    <rect x="258" y="216" width="716" height="34" rx="10" fill="#0b0f0d"/>
    <rect x="258" y="236" width="716" height="14" fill="#0b0f0d"/>
    <circle cx="276" cy="233" r="5" fill="#34D6A0"/><circle cx="292" cy="233" r="5" fill="rgba(255,255,255,.18)"/><circle cx="308" cy="233" r="5" fill="rgba(255,255,255,.18)"/>
    <text x="326" y="237" font-size="11" fill="rgba(255,255,255,.6)" font-family="Consolas, monospace">prod-web · live</text>
    <text x="946" y="237" font-size="11" fill="rgba(255,255,255,.55)" text-anchor="end" font-family="Consolas, monospace">connected</text>

    <g font-family="Consolas, monospace" font-size="12.5">
      <text x="276" y="278" fill="#34D6A0">ubuntu@prod-web</text><text x="410" y="278" fill="#8aa">:</text><text x="418" y="278" fill="#6cf">~</text><text x="426" y="278" fill="#ccc">$ uptime</text>
      <text x="276" y="300" fill="#c9d3cd"> 15:42:01 up 42 days,  3:14,  1 user,  load average: 0.08, 0.12, 0.09</text>
      <text x="276" y="326" fill="#34D6A0">ubuntu@prod-web</text><text x="410" y="326" fill="#8aa">:</text><text x="418" y="326" fill="#6cf">~</text><text x="426" y="326" fill="#ccc">$ docker ps --format "table {{.Names}}\t{{.Status}}"</text>
      <text x="276" y="348" fill="#c9d3cd">NAMES        STATUS</text>
      <text x="276" y="368" fill="#c9d3cd">api          Up 6 days (healthy)</text>
      <text x="276" y="388" fill="#c9d3cd">nginx        Up 6 days</text>
      <text x="276" y="408" fill="#c9d3cd">postgres     Up 6 days (healthy)</text>
      <text x="276" y="434" fill="#34D6A0">ubuntu@prod-web</text><text x="410" y="434" fill="#8aa">:</text><text x="418" y="434" fill="#6cf">~</text><text x="426" y="434" fill="#ccc">$ sudo systemctl status nginx --no-pager | head -3</text>
      <text x="276" y="456" fill="#c9d3cd">● nginx.service - A high performance web server</text>
      <text x="276" y="476" fill="#c9d3cd">     Active: </text><text x="342" y="476" fill="#7FEBC4">active (running)</text><text x="452" y="476" fill="#c9d3cd"> since Mon; 6 days ago</text>
      <text x="276" y="502" fill="#34D6A0">ubuntu@prod-web</text><text x="410" y="502" fill="#8aa">:</text><text x="418" y="502" fill="#6cf">~</text><text x="426" y="502" fill="#ccc">$ </text>
      <rect x="438" y="492" width="8" height="14" fill="#34D6A0"/>
    </g>
    <text x="258" y="568" font-size="11.5" fill="#5C6B64">A real interactive shell (a true PTY). Output is recorded and replayable.</text>
  </g>
</svg>
