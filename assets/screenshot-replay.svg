<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="logo3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FC894"/><stop offset="1" stop-color="#0C8F68"/>
    </linearGradient>
    <clipPath id="round3"><rect width="1000" height="600" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#round3)">
    <rect width="1000" height="600" fill="#F6F8F7"/>

    <!-- browser chrome -->
    <rect width="1000" height="38" fill="#E8ECEA"/>
    <circle cx="20" cy="19" r="5" fill="#F6685E"/><circle cx="38" cy="19" r="5" fill="#F7BD46"/><circle cx="56" cy="19" r="5" fill="#5FCB6E"/>
    <rect x="80" y="9" width="410" height="20" rx="10" fill="#FFFFFF"/>
    <text x="94" y="23" font-size="11" fill="#5C6B64" font-family="Consolas, monospace">🔒 127.0.0.1:8022/recordings/9017b7e9…</text>

    <!-- sidebar -->
    <rect x="0" y="38" width="230" height="562" fill="#FFFFFF"/>
    <line x1="230" y1="38" x2="230" y2="600" stroke="#E1E7E4"/>
    <rect x="16" y="54" width="26" height="26" rx="7" fill="url(#logo3)"/>
    <g stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".95"><line x1="29" y1="67" x2="29" y2="61"/><line x1="29" y1="67" x2="23.5" y2="73"/><line x1="29" y1="67" x2="34.5" y2="73"/></g>
    <text x="52" y="72" font-size="15" font-weight="700" fill="#16211C">SSH Console</text>
    <rect x="12" y="94" width="206" height="34" rx="9" fill="#FFFFFF" stroke="#CDE9DD" stroke-dasharray="4 3"/>
    <text x="26" y="116" font-size="13" font-weight="600" fill="#0A7355">＋  Add connection</text>
    <text x="14" y="150" font-size="10" font-weight="700" letter-spacing="1" fill="#5C6B64">SSH CONNECTIONS</text>
    <circle cx="28" cy="177" r="4" fill="#0F8A5F"/><text x="42" y="181" font-size="13" fill="#16211C">prod-web</text>
    <circle cx="28" cy="205" r="4" fill="#0F8A5F"/><text x="42" y="209" font-size="13" fill="#16211C">db-primary</text>
    <line x1="12" y1="556" x2="218" y2="556" stroke="#E1E7E4"/>
    <rect x="12" y="564" width="206" height="30" rx="9" fill="#DDF1E8"/>
    <text x="30" y="583" font-size="13" font-weight="600" fill="#0A7355">◉  Recordings</text>

    <!-- content -->
    <text x="258" y="70" font-size="12" fill="#0A7355">← prod-web</text>
    <text x="258" y="98" font-size="22" font-weight="700" fill="#16211C">Session replay</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#5C6B64">
      <rect x="258" y="112" width="86" height="20" rx="10" fill="#EEF2F0"/><text x="268" y="126">prod-web</text>
      <rect x="352" y="112" width="78" height="20" rx="10" fill="#EEF2F0"/><text x="362" y="126">2h ago</text>
      <rect x="438" y="112" width="104" height="20" rx="10" fill="#EEF2F0"/><text x="448" y="126">lasted 3m 20s</text>
      <rect x="550" y="112" width="118" height="20" rx="10" fill="#EEF2F0"/><text x="560" y="126">12.4 KiB output</text>
    </g>

    <!-- replay terminal -->
    <rect x="258" y="146" width="716" height="330" rx="10" fill="#000000" stroke="#E1E7E4"/>
    <rect x="258" y="146" width="716" height="34" rx="10" fill="#0b0f0d"/>
    <rect x="258" y="166" width="716" height="14" fill="#0b0f0d"/>
    <circle cx="276" cy="163" r="5" fill="rgba(255,255,255,.18)"/><circle cx="292" cy="163" r="5" fill="rgba(255,255,255,.18)"/><circle cx="308" cy="163" r="5" fill="rgba(255,255,255,.18)"/>
    <text x="326" y="167" font-size="11" fill="rgba(255,255,255,.6)" font-family="Consolas, monospace">prod-web · replay</text>
    <g font-family="Consolas, monospace" font-size="12.5">
      <text x="276" y="208" fill="#34D6A0">ubuntu@prod-web</text><text x="410" y="208" fill="#8aa">:</text><text x="418" y="208" fill="#6cf">~</text><text x="426" y="208" fill="#ccc">$ tail -f /var/log/app.log</text>
      <text x="276" y="230" fill="#c9d3cd">[15:39:58] INFO  request id=8f21 path=/api/orders 200 34ms</text>
      <text x="276" y="250" fill="#c9d3cd">[15:39:59] INFO  request id=8f22 path=/api/users  200 11ms</text>
      <text x="276" y="270" fill="#e0a64d">[15:40:01] WARN  slow query 812ms on orders_by_user</text>
      <text x="276" y="290" fill="#c9d3cd">[15:40:02] INFO  request id=8f23 path=/healthz    200  2ms</text>
      <text x="276" y="310" fill="#c9d3cd">[15:40:04] INFO  cache warm complete (1042 keys)</text>
      <text x="276" y="330" fill="#f87171">[15:40:06] ERROR upstream timeout calling payments (retry 1/3)</text>
      <text x="276" y="350" fill="#c9d3cd">[15:40:07] INFO  retry succeeded id=8f24 payments 200</text>
      <text x="276" y="370" fill="#c9d3cd">[15:40:09] INFO  request id=8f25 path=/api/orders 201 41ms</text>
      <text x="276" y="392" fill="#34D6A0">ubuntu@prod-web</text><text x="410" y="392" fill="#8aa">:</text><text x="418" y="392" fill="#6cf">~</text><text x="426" y="392" fill="#ccc">$ </text>
    </g>
    <text x="290" y="452" font-size="11" fill="rgba(255,255,255,.35)" font-family="Consolas, monospace">▸ replaying with original timing…</text>

    <!-- player controls -->
    <rect x="258" y="490" width="716" height="46" rx="9" fill="#FFFFFF" stroke="#E1E7E4"/>
    <rect x="272" y="502" width="86" height="22" rx="8" fill="#FFFFFF" stroke="#E1E7E4"/><text x="315" y="517" font-size="12" font-weight="600" fill="#16211C" text-anchor="middle">⏸ Pause</text>
    <rect x="372" y="511" width="420" height="4" rx="2" fill="#E1E7E4"/>
    <rect x="372" y="511" width="150" height="4" rx="2" fill="#0C8F68"/>
    <circle cx="522" cy="513" r="7" fill="#0C8F68"/>
    <text x="806" y="517" font-size="12" font-family="Consolas, monospace" fill="#5C6B64">1:11 / 3:20</text>
    <rect x="892" y="502" width="24" height="22" rx="6" fill="#DDF1E8" stroke="#BFE7D6"/><text x="904" y="517" font-size="11" font-weight="600" fill="#0A7355" text-anchor="middle">1×</text>
    <rect x="920" y="502" width="24" height="22" rx="6" fill="#FFFFFF" stroke="#E1E7E4"/><text x="932" y="517" font-size="11" font-weight="600" fill="#5C6B64" text-anchor="middle">2×</text>
    <rect x="948" y="502" width="24" height="22" rx="6" fill="#FFFFFF" stroke="#E1E7E4"/><text x="960" y="517" font-size="11" font-weight="600" fill="#5C6B64" text-anchor="middle">4×</text>

    <text x="258" y="562" font-size="11.5" fill="#5C6B64">Plays back the whole session with its original timing — scrub the slider or speed it up.</text>
  </g>
</svg>
