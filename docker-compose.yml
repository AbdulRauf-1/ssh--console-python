# SSH Console (Python) — the whole thing in one container. No database service:
# storage is a local SQLite file kept in the `data` volume.
#
#   docker compose up -d                          loopback only (use an SSH tunnel)
#   SSHCONSOLE_BIND=0.0.0.0 docker compose up -d   reachable on the server's public IP
#   docker compose down                           stops it; the volume (your data) remains

name: ssh-console-py

services:
  app:
    build: .
    image: ssh-console-py:latest
    restart: unless-stopped
    # Publish "<bind>:<host-port>:8022".
    #   - Defaults to 127.0.0.1 (loopback only) on purpose: the app has NO login, so
    #     it must not sit on a public interface unless you mean it.
    #   - To expose it on the server's public IP (VPS/EC2), set SSHCONSOLE_BIND=0.0.0.0
    #     and open the port in your firewall / cloud Security Group.
    #   - Change the host port with SSHCONSOLE_HOST_PORT; the container side stays 8022.
    ports:
      - "${SSHCONSOLE_BIND:-127.0.0.1}:${SSHCONSOLE_HOST_PORT:-8022}:8022"
    volumes:
      - data:/data
    # Optional: cap concurrent live terminals (0/unset = unlimited).
    # environment:
    #   SSHCONSOLE_MAX_TERMINALS: "0"

volumes:
  data:
