# SSH Console (Python) — the whole thing in one container. No database service:
# storage is a local SQLite file kept in the `data` volume.
#
#   docker compose up -d      then open http://127.0.0.1:8022
#   docker compose down       stops it; the volume (your data) remains

name: ssh-console-py

services:
  app:
    build: .
    image: ssh-console-py:latest
    restart: unless-stopped
    # Bound to loopback on purpose: a tool that opens shells should not sit on a
    # public interface. Change deliberately, and put auth + TLS in front if you do.
    # Left side = the port on YOUR machine; change it freely. Right side must stay
    # 8022 (the port inside the container).
    ports:
      - "127.0.0.1:8022:8022"
    volumes:
      - data:/data
    # Optional: cap concurrent live terminals (0/unset = unlimited).
    # environment:
    #   SSHCONSOLE_MAX_TERMINALS: "0"

volumes:
  data:
